# Local PostgreSQL. The schema is applied automatically the first time the volume is created.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: htafl
      POSTGRES_PASSWORD: htafl
      POSTGRES_DB: htafl
    ports:
      - "5432:5432"
    volumes:
      - htafl_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  htafl_pgdata:
